name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable

      - name: Build release binary for Windows
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --package toolbox --bin toolbox

      - name: Name release binary
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: Copy-Item -LiteralPath target/release/toolbox.exe -Destination "toolbox-$env:RELEASE_TAG-windows-x86_64.exe"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$env:RELEASE_TAG"
          "toolbox-$env:RELEASE_TAG-windows-x86_64.exe"
          --title "Toolbox $env:RELEASE_TAG"
          --generate-notes
          --verify-tag
