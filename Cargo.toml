[package]
name = "toolbox"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
iced = { version = "0.14.0", features = ["tokio", "sipper"] }
open = "5.4.4"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rfd = "0.17.2"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2"
mail-parser = { version = "1", default-features = false }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"

[dev-dependencies]
iced_test = "0.14"
