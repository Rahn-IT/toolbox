[package]
name = "toolbox"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
sys-locale = "0.3.2"
iced = { version = "0.14.0", features = ["advanced", "tokio", "sipper"] }
open = "5.4.5"
rfd = "0.18.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = "2"
mail-parser = { version = "1", default-features = false }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = "0.3"
hickory-client = { version = "0.25.2", features = ["https-ring", "webpki-roots"] }
hickory-resolver = { version = "0.26.4", default-features = false, features = ["tokio"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }

[target.'cfg(unix)'.dependencies]
hickory-resolver = { version = "0.26.4", default-features = false, features = ["system-config"] }

[target.'cfg(windows)'.dependencies]
ipconfig = { version = "0.3.4", default-features = false }
regex = "1.13.2"

[dev-dependencies]
iced_test = "0.14"
